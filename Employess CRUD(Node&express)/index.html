<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="./style.css" />
    <title>Employee Management</title>
    <style>
      .overlay {
        display: none;
        backdrop-filter: blur(3px);
        z-index: 99;
      }
      .overlay.show {
        display: block;
      }
      .popup {
        position: absolute !important;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        animation: comeFromBottom 0.3s forwards ease-in-out;
        z-index: 100;
        max-width: 1000px;
      }
      .popup.show {
        display: block;
      }
    </style>
  </head>
  <body class="overflow-x-hidden">
    <div class="overlay position-absolute top-0 left-0 w-100 h-100 bg-black opacity-50"></div>
    <section class="popup col-12 col-lg-8 px-4 position-fixed">
      <form class="form">
        <div class="bg-white p-5 rounded-4 shadow-lg">
          <h2 class="text-center mb-4 text-primary fw-bold">Employee Details</h2>
          <div class="row g-3">
            <div class="col-sm-12 mb-3">
              <label for="employeeId" class="form-label fw-bold">Employee ID*</label>
              <input type="text" name="employeeId" id="employeeId" class="form-control rounded-3" placeholder="Enter employee ID" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="name" class="form-label fw-bold">Name*</label>
              <input type="text" name="name" id="name" class="form-control rounded-3" placeholder="Enter employee name" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="address" class="form-label fw-bold">Address*</label>
              <input type="text" name="address" id="address" class="form-control rounded-3" placeholder="Enter employee address" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="salary" class="form-label fw-bold">Salary*</label>
              <input type="number" name="salary" id="salary" class="form-control rounded-3" placeholder="Enter employee salary" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="gender" class="form-label fw-bold">Gender*</label>
              <select name="gender" id="gender" class="form-control rounded-3" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <button type="submit" class="submit-btn btn btn-primary w-100 mt-3 py-2 fw-bold rounded-pill">Add Employee</button>
        </div>
      </form>
      <button class="popup-close-btn btn btn-outline-danger position-absolute fw-bold" style="right: 2rem; top: 0.5rem">X</button>
    </section>
    <nav class="py-3 position-fixed top-0 left-0 w-100 shadow-lg bg-dark bg-opacity-95" style="z-index: 90">
      <div class="container mx-auto d-flex align-items-center justify-content-between">
        <h2 class="text-white mb-0">Employee Management</h2>
        <button class="popup-open-btn btn btn-primary text-white rounded-pill px-3">Add Employee</button>
      </div>
    </nav>
    <section style="padding-top: 8rem; padding-bottom: 3rem;">
      <div class="container mx-auto">
        <h1 class="text-center mb-4 fw-bold text-primary">Employee List</h1>
        <div class="row cards-container g-4"></div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
