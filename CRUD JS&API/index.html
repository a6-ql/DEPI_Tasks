<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="./style.css" />
    <title>Book Library</title>
    <style>
      .overlay {
        display: none;
        backdrop-filter: blur(3px);
        z-index: 99;
      }
      .overlay.show {
        display: block;
      }
      .popup {
        position: absolute !important;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        animation: comeFromBottom 0.3s forwards ease-in-out;
        z-index: 100;
        max-width: 1000px;
      }
      .popup.show {
        display: block;
      }
    </style>
  </head>
  <body class="overflow-x-hidden">
    <div class="overlay position-absolute top-0 left-0 w-100 h-100 bg-black opacity-50"></div>
    <section class="popup col-12 col-lg-8 px-4 position-fixed">
      <form class="form">
        <div class="bg-white p-5 rounded-4 shadow-lg">
          <h2 class="text-center mb-4 text-primary fw-bold">Create Your Book</h2>
          <div class="row g-3">
            <div class="col-sm-12 mb-3">
              <label for="bookName" class="form-label fw-bold">Book Name*</label>
              <input type="text" name="bookName" id="bookName" class="form-control rounded-3" placeholder="Enter your book name" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="author" class="form-label fw-bold">Author*</label>
              <input type="text" name="author" id="author" class="form-control rounded-3" placeholder="Enter your book author" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="price" class="form-label fw-bold">Price*</label>
              <input type="number" name="price" id="price" class="form-control rounded-3" placeholder="Enter your book price" required />
            </div>
            <div class="col-sm-12 mb-3">
              <label for="description" class="form-label fw-bold">Description*</label>
              <textarea name="description" id="description" class="form-control rounded-3" placeholder="Enter your book description" style="height: 100px; resize: none" required></textarea>
            </div>
          </div>
          <button type="submit" class="submit-btn btn btn-primary w-100 mt-3 py-2 fw-bold rounded-pill">Create Book</button>
        </div>
      </form>
      <button class="popup-close-btn btn btn-outline-danger position-absolute fw-bold" style="right: 2rem; top: 0.5rem">X</button>
    </section>
    <nav class="py-3 position-fixed top-0 left-0 w-100 shadow-lg bg-dark bg-opacity-95" style="z-index: 90">
      <div class="container mx-auto d-flex align-items-center justify-content-between">
        <h2 class="text-white mb-0">Book Library</h2>
        <button class="popup-open-btn btn btn-primary text-white rounded-pill px-3">Add Book</button>
      </div>
    </nav>
    <section style="padding-top: 8rem; padding-bottom: 3rem;">
      <div class="container mx-auto">
        <h1 class="text-center mb-4 fw-bold text-primary">Our Book Collection</h1>
        <div class="row cards-container g-4"></div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
